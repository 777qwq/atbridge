name: build-wxrelay
on:
  push:
    paths: ['wxrelay_relay/**', 'wxrelay_sender/**', '.github/workflows/build-wxrelay.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ldid dpkg
      - name: Build relay (arm64e, SpringBoard)
        run: |
          cd wxrelay_relay
          xcrun -sdk iphoneos clang -arch arm64e -target arm64e-apple-ios16.3 -dynamiclib \
            -framework Foundation -framework CoreFoundation -fobjc-arc \
            -o WXRelayRelay.dylib Tweak.m -lobjc
          ldid -M -S WXRelayRelay.dylib
          vtool -show-build WXRelayRelay.dylib | grep -A2 platform
      - name: Build sender (arm64, WeChat)
        run: |
          cd wxrelay_sender
          xcrun -sdk iphoneos clang -arch arm64 -target arm64-apple-ios16.3 -dynamiclib \
            -framework Foundation -framework UIKit -framework CoreFoundation -framework AVFoundation -fobjc-arc \
            -o WXRelay.dylib Tweak.m -lobjc
          ldid -M -S WXRelay.dylib
          vtool -show-build WXRelay.dylib | grep -A2 platform
      - name: Install theos
        run: |
          brew install make xz
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          cd $HOME/theos && git submodule update --init --recursive && cd -
          rm -f $HOME/theos/sdks/iPhoneOS*.sdk 2>/dev/null || true
          curl -sL https://github.com/theos/sdks/archive/refs/heads/master.zip -o /tmp/sdk.zip
          unzip -q /tmp/sdk.zip -d /tmp
          mv /tmp/sdks-master/iPhoneOS16.5.sdk $HOME/theos/sdks/
          ln -s $HOME/theos/sdks/iPhoneOS16.5.sdk $HOME/theos/sdks/iPhoneOS16.3.sdk
      - name: Build pref bundle (Settings entry)
        run: |
          export THEOS=$HOME/theos
          cd wxrelay_pref
          gmake package FINAL=1
          find .theos -name "wxrelaypref*" -maxdepth 8 | head -10
      - name: Assemble deb (single pass)
        run: |
          mkdir -p pkg/DEBIAN pkg/var/jb/Library/MobileSubstrate/DynamicLibraries pkg/var/jb/Library/PreferenceBundles pkg/var/jb/Library/PreferenceLoader/Preferences
          cp wxrelay_relay/WXRelayRelay.dylib wxrelay_sender/WXRelay.dylib pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/
          printf '{ Filter = { Bundles = ( "com.apple.springboard" ); }; }\n' > pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/WXRelayRelay.plist
          printf '{ Filter = { Bundles = ( "com.tencent.xin" ); }; }\n' > pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/WXRelay.plist
          BUNDLE_DIR=$(find wxrelay_pref/.theos -type d -name "wxrelaypref.bundle" | head -1)
          ENTRY_PL=$(find wxrelay_pref/.theos -name "wxrelaypref.plist" -path "*PreferenceLoader*" | head -1)
          echo "BUNDLE_DIR=$BUNDLE_DIR ENTRY_PL=$ENTRY_PL"
          rsync -a --exclude='*.dSYM' "$BUNDLE_DIR/" pkg/var/jb/Library/PreferenceBundles/wxrelaypref.bundle/
          cp "$ENTRY_PL" pkg/var/jb/Library/PreferenceLoader/Preferences/wxrelaypref.plist
          find pkg -name "*.dSYM" -type d -exec rm -rf {} + 2>/dev/null || true
          printf 'Package: com.mos.wxrelay\nName: WXRelay 微信通知转发\nVersion: 1.1.5\nArchitecture: iphoneos-arm64\nDescription: 通知文本匹配 -> 微信静默转发。统一配置: 微信沙盒 tmp/wxrelay.cfg (catch=匹配文本#目标id, testTarget, keepAlive=1)。设置入口: 设置->WXRelay\nAuthor: mos\n' > pkg/DEBIAN/control
          dpkg-deb --root-owner-group --build pkg WXRelay-1.1.5.deb
          mkdir out && cp WXRelay-1.1.5.deb out/
          dpkg-deb -c out/WXRelay-1.1.5.deb
      - uses: actions/upload-artifact@v4
        with:
          name: wxrelay-deb
          path: out/
