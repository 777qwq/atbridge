name: build-atbridge
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install ldid
        run: brew install ldid
      - name: Build fat dylib
        run: |
          clang -arch arm64 -arch arm64e -dynamiclib \
            -framework Foundation -framework CoreFoundation -fobjc-arc \
            -o ATBridge.dylib Tweak.m
          ldid -M -S ATBridge.dylib
          lipo -info ATBridge.dylib
      - name: Package deb (rootless)
        run: |
          mkdir -p pkg/var/jb/Library/MobileSubstrate/DynamicLibraries pkg/DEBIAN out
          cp ATBridge.dylib pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/
          printf '{ Filter = { Bundles = ( "com.apple.springboard" ); }; }\n' > pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/ATBridge.plist
          printf 'Package: me.autotouch.atbridge\nName: ATBridge\nVersion: 1.0.3\nArchitecture: iphoneos-arm64\nDescription: Fake LAActivator shell for ATTweak; trigger via notifyutil -p net.autotouch.atbridge.<eventname>\nAuthor: 777qwq\n' > pkg/DEBIAN/control
          echo 2.0 > debian-binary
          tar czf data.tar.gz -C pkg var
          tar czf control.tar.gz -C pkg DEBIAN
          ar rc ATBridge-1.0.3_rootless.deb debian-binary control.tar.gz data.tar.gz
          cp ATBridge-1.0.3_rootless.deb out/
          ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: atbridge-deb
          path: out/
